<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Data Pet - A melhor gestão para o seu Petshop</title>
    <meta name="theme-color" content="#313485" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Data Pet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <meta name="description" content="Gerencie seu petshop com facilidade. Controle de clientes, pets, financeiro e muito mais em uma plataforma moderna e intuitiva." />
    <style>
      #initial-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        background-color: #F8FAFC;
        font-family: 'Outfit', sans-serif;
      }
      .loader-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .loader-logo {
        width: 120px;
        max-width: 80vw;
        height: auto;
        display: block;
        object-fit: contain;
        animation: logo-pulse 2s ease-in-out infinite;
        filter: drop-shadow(0 6px 16px rgba(49, 52, 133, 0.12));
      }
      @keyframes logo-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.95;
          filter: drop-shadow(0 6px 16px rgba(49, 52, 133, 0.12));
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
          filter: drop-shadow(0 12px 28px rgba(49, 52, 133, 0.22));
        }
      }
      .loader-text {
        color: #313485;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .loader-progress {
        width: 140px;
        height: 4px;
        background: rgba(49, 52, 133, 0.08);
        border-radius: 99px;
        margin-top: 16px;
        overflow: hidden;
        position: relative;
      }
      .loader-progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #313485, #FF751F);
        border-radius: 99px;
        animation: loader-slide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes loader-slide {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-logo-container">
          <img src="/logo.png" alt="Data Pet" class="loader-logo" />
        </div>
        <div class="loader-text">Preparando tudo para você...</div>
        <div class="loader-progress">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
